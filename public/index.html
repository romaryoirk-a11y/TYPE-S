<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мессенджер</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; overflow: hidden; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20, 20, 40, 0.55); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-card { background: #fff; padding: 36px; border-radius: 24px; width: 100%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,0.35); animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 90vh; overflow-y: auto; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-card h2 { font-size: 24px; color: #1f2544; margin-bottom: 8px; font-weight: 700; text-align: center; }
  .modal-card .sub { color: #6d7290; font-size: 14px; margin-bottom: 22px; text-align: center; }
  .modal-card label { display: block; font-size: 13px; font-weight: 600; color: #4a5070; margin: 12px 0 6px; }
  .modal-card input[type="text"], .modal-card textarea { width: 100%; padding: 13px 16px; border: 2px solid #ebedf3; border-radius: 12px; font-size: 15px; outline: none; transition: border 0.2s, box-shadow 0.2s; color: #1f2544; font-family: inherit; resize: vertical; min-height: 46px; }
  .modal-card textarea { min-height: 70px; }
  .modal-card input:focus, .modal-card textarea:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.12); }
  .modal-card .primary-btn { width: 100%; margin-top: 20px; padding: 14px 24px; border: none; border-radius: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .modal-card .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(102,126,234,0.4); }
  .modal-card .cancel-btn { width: 100%; margin-top: 8px; padding: 12px; border: none; background: transparent; color: #9296a8; font-size: 14px; cursor: pointer; border-radius: 12px; }
  .modal-card .cancel-btn:hover { background: #f5f6fb; }

  .type-select { display: flex; gap: 10px; margin-top: 6px; }
  .type-select .type-opt { flex: 1; padding: 14px; border: 2px solid #ebedf3; border-radius: 12px; cursor: pointer; text-align: center; transition: all 0.2s; background: #fff; }
  .type-select .type-opt:hover { border-color: #c9cee4; }
  .type-select .type-opt.selected { border-color: #667eea; background: rgba(102,126,234,0.06); box-shadow: 0 0 0 4px rgba(102,126,234,0.08); }
  .type-select .type-opt .icon { font-size: 22px; display: block; margin-bottom: 4px; }
  .type-select .type-opt .label { font-size: 13px; font-weight: 600; color: #1f2544; }
  .type-select .type-opt .desc { font-size: 10.5px; color: #9296a8; margin-top: 2px; }

  .avatar-editor { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 20px 0 4px; }
  .avatar-preview { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg,#667eea,#764ba2); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 32px; box-shadow: 0 8px 24px rgba(102,126,234,0.35); border: 4px solid #fff; transition: transform 0.2s; overflow: hidden; }
  .avatar-preview:hover { transform: scale(1.04); }
  .avatar-upload-btn { padding: 10px 20px; border: 2px solid #ebedf3; background: #fff; border-radius: 12px; font-size: 13.5px; font-weight: 600; color: #667eea; cursor: pointer; transition: all 0.2s; }
  .avatar-upload-btn:hover { border-color: #667eea; background: rgba(102,126,234,0.06); }
  .avatar-upload-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .avatar-remove-btn { padding: 8px 16px; border: none; background: transparent; color: #ee5a6f; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 10px; transition: background 0.2s; }
  .avatar-remove-btn:hover { background: #ffe5e5; }

  .avatar img, .avatar-preview img, .me-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }

  .app { display: flex; width: 100%; max-width: 1150px; height: 92vh; max-height: 800px; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 70px rgba(0,0,0,0.35); animation: appear 0.5s ease; }
  @keyframes appear { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .sidebar { width: 330px; background: #f7f8fc; border-right: 1px solid #ebedf3; display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px 18px 12px; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h1 { font-size: 22px; font-weight: 700; color: #1f2544; letter-spacing: -0.3px; }
  .header-btns { display: flex; gap: 6px; align-items: center; }
  .icon-round { width: 38px; height: 38px; border: none; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #667eea; transition: transform 0.2s, background 0.2s, color 0.2s; box-shadow: 0 2px 6px rgba(102,126,234,0.1); font-size: 18px; }
  .icon-round:hover { transform: scale(1.08); }
  .icon-round.on { background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; }

  .me-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: transform 0.2s; position: relative; overflow: hidden; }
  .me-avatar:hover { transform: scale(1.08); }
  .me-avatar::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 12px; height: 12px; background: #2ecc71; border: 2.5px solid #f7f8fc; border-radius: 50%; z-index: 2; }

  .section-label { padding: 12px 22px 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #a0a4b8; }

  .chats { flex: 1; overflow-y: auto; padding: 0 10px 16px; }
  .chats::-webkit-scrollbar { width: 6px; }
  .chats::-webkit-scrollbar-thumb { background: #d8dbe6; border-radius: 3px; }

  .chat-item { display: flex; gap: 12px; padding: 11px 12px; border-radius: 14px; cursor: pointer; transition: background 0.2s; position: relative; align-items: center; }
  .chat-item:hover { background: #eef0f8; }
  .chat-item.active { background: #fff; box-shadow: 0 4px 14px rgba(102,126,234,0.12); }
  .chat-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: #667eea; border-radius: 0 3px 3px 0; }

  .avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 15px; flex-shrink: 0; position: relative; overflow: hidden; }
  .avatar .status { position: absolute; bottom: 0; right: 0; width: 13px; height: 13px; border: 2.5px solid #f7f8fc; border-radius: 50%; background: #2ecc71; z-index: 2; }
  .chat-item.active .avatar .status { border-color: #fff; }
  .avatar .status.offline { background: #b0b4c3; }
  .avatar .room-emoji { font-size: 20px; }

  .chat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .chat-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-name { font-weight: 600; font-size: 14.5px; color: #1f2544; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 11.5px; color: #9296a8; flex-shrink: 0; }
  .chat-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chat-preview { font-size: 12.5px; color: #6d7290; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .badge { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }

  .join-btn { width: 30px; height: 30px; border: none; border-radius: 50%; background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.2s; }
  .join-btn:hover { transform: scale(1.12); }

  .chat-window { flex: 1; display: flex; flex-direction: column; background: #fff; position: relative; }
  .chat-header { padding: 14px 22px; border-bottom: 1px solid #ebedf3; display: flex; align-items: center; gap: 14px; z-index: 2; background: #fff; }
  .chat-header .avatar { width: 44px; height: 44px; font-size: 15px; }
  .header-info { flex: 1; min-width: 0; }
  .header-info h2 { font-size: 16px; font-weight: 600; color: #1f2544; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .header-info h2 .room-tag { font-size: 10px; font-weight: 700; padding: 2px 6px; background: #eef0f8; color: #667eea; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .header-info p { font-size: 12.5px; color: #2ecc71; display: flex; align-items: center; gap: 5px; }
  .header-info p::before { content: ''; width: 6px; height: 6px; background: #2ecc71; border-radius: 50%; }
  .header-info p.offline { color: #9296a8; }
  .header-info p.offline::before { background: #b0b4c3; }
  .header-info p.plain { color: #9296a8; }
  .header-info p.plain::before { display: none; }

  .icon-btn { width: 40px; height: 40px; border: none; background: transparent; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #6d7290; transition: background 0.2s, color 0.2s; flex-shrink: 0; }
  .icon-btn:hover { background: #f0f2f9; color: #667eea; }
  .icon-btn.danger:hover { background: #ffe5e5; color: #ee5a6f; }

  .messages { flex: 1; overflow-y: auto; padding: 22px 26px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, #fafbff 0%, #ffffff 100%); }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #d8dbe6; border-radius: 3px; }

  .msg-wrap { display: flex; flex-direction: column; max-width: 68%; }
  .msg-wrap.me { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.them { align-self: flex-start; align-items: flex-start; }
  .sender-name { font-size: 11.5px; font-weight: 600; margin: 0 0 3px 12px; display: flex; align-items: center; gap: 5px; }
  .sender-avatar { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }

  .msg { padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; word-wrap: break-word; word-break: break-word; animation: msgIn 0.28s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.04); position: relative; max-width: 100%; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.incoming { background: #fff; color: #1f2544; border-bottom-left-radius: 4px; border: 1px solid #ebedf3; }
  .msg.outgoing { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-bottom-right-radius: 4px; }

  .msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 3px; }
  .msg-time { font-size: 10.5px; opacity: 0.65; }
  .msg.incoming .msg-time { color: #9296a8; }
  .msg-status { display: inline-flex; align-items: center; font-size: 11px; opacity: 0.85; letter-spacing: -1px; }
  .msg-status.read { color: #a8e0ff; opacity: 1; }
  .msg.incoming .msg-status.read { color: #667eea; }
  .msg-reads { font-size: 10px; background: rgba(255,255,255,0.22); padding: 1px 5px; border-radius: 6px; letter-spacing: 0; }
  .msg.incoming .msg-reads { background: #eef0f8; color: #667eea; }

  .msg-image { max-width: 100%; max-height: 320px; border-radius: 10px; display: block; margin: 4px 0; cursor: pointer; transition: transform 0.2s; }
  .msg-image:hover { transform: scale(1.01); }
  .msg-file { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 4px 0; background: rgba(255,255,255,0.15); border-radius: 10px; text-decoration: none; color: inherit; border: 1px solid rgba(255,255,255,0.2); transition: background 0.2s; max-width: 100%; }
  .msg.incoming .msg-file { background: #f5f6fb; border-color: #ebedf3; }
  .msg-file:hover { background: rgba(255,255,255,0.28); }
  .msg.incoming .msg-file:hover { background: #eef0f8; }
  .file-icon { font-size: 22px; flex-shrink: 0; }
  .file-details { display: flex; flex-direction: column; min-width: 0; }
  .file-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .file-size { font-size: 11px; opacity: 0.7; }

  .typing-indicator { align-self: flex-start; background: #fff; border: 1px solid #ebedf3; padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 4px; display: flex; gap: 4px; }
  .typing-indicator span { width: 7px; height: 7px; background: #b0b4c3; border-radius: 50%; animation: blink 1.4s infinite; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #a0a4b8; text-align: center; }
  .empty-chat .em { font-size: 52px; opacity: 0.5; }
  .empty-chat p { font-size: 14px; }

  .pending-file { padding: 0 20px; display: none; }
  .pending-file-inner { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #f5f6fb; border-radius: 14px; border: 1px solid #ebedf3; margin-bottom: 8px; animation: msgIn 0.25s ease; }
  .pending-preview-img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .pending-file-info { flex: 1; min-width: 0; }
  .pending-file-info .name { font-size: 13.5px; font-weight: 600; color: #1f2544; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pending-file-info .size { font-size: 11.5px; color: #9296a8; }
  .pending-remove { background: transparent; border: none; cursor: pointer; color: #9296a8; font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 50%; transition: background 0.2s, color 0.2s; }
  .pending-remove:hover { background: #ffe5e5; color: #ee5a6f; }

  .input-area { padding: 12px 20px 16px; border-top: 1px solid #ebedf3; display: flex; align-items: flex-end; gap: 10px; background: #fff; }
  .input-wrapper { flex: 1; display: flex; align-items: flex-end; background: #f5f6fb; border-radius: 22px; padding: 6px 6px 6px 16px; transition: background 0.2s, box-shadow 0.2s; border: 1px solid transparent; }
  .input-wrapper:focus-within { background: #fff; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); }
  .input-wrapper textarea { flex: 1; border: none; background: transparent; outline: none; resize: none; font-size: 14.5px; color: #1f2544; line-height: 1.4; max-height: 120px; padding: 8px 0; font-family: inherit; }
  .input-wrapper textarea::placeholder { color: #a0a4b8; }
  .input-wrapper textarea:disabled { cursor: not-allowed; }

  .send-btn { width: 40px; height: 40px; border: none; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, opacity 0.2s; flex-shrink: 0; }
  .send-btn:hover { transform: scale(1.08); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn.uploading svg { display: none; }
  .send-btn.uploading::after { content: ''; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .drop-overlay { position: absolute; inset: 0; background: rgba(102,126,234,0.1); border: 3px dashed #667eea; border-radius: 12px; display: none; align-items: center; justify-content: center; color: #667eea; font-weight: 600; font-size: 18px; z-index: 5; pointer-events: none; backdrop-filter: blur(4px); }
  .drop-overlay.active { display: flex; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; cursor: zoom-out; padding: 40px; animation: fadeIn 0.2s; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1f2544; color: #fff; padding: 12px 22px; border-radius: 12px; font-size: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.25); z-index: 3000; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s; opacity: 0; max-width: 90vw; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 720px) {
    body { padding: 0; }
    .app { height: 100vh; max-height: none; border-radius: 0; }
    .sidebar { position: absolute; inset: 0; width: 100%; z-index: 10; transition: transform 0.3s ease; }
    .sidebar.hidden { transform: translateX(-100%); }
    .back-btn { display: flex !important; }
    .msg-wrap { max-width: 85%; }
    .messages { padding: 16px; }
    .file-name { max-width: 140px; }
  }
  .back-btn { display: none; }
</style>
</head>
<body>

<div class="modal-overlay" id="nameModal">
  <div class="modal-card">
    <h2>Добро пожаловать 👋</h2>
    <div class="sub">Введите ваше имя, чтобы начать общение</div>
    <input id="nameInput" type="text" placeholder="Ваше имя" maxlength="30" autofocus>
    <button class="primary-btn" id="nameSubmit">Войти в чат</button>
  </div>
</div>

<div class="modal-overlay" id="createModal" style="display:none">
  <div class="modal-card">
    <h2>Новая группа или канал</h2>
    <div class="sub">Создайте пространство для общения</div>
    <label>Тип</label>
    <div class="type-select" id="typeSelect">
      <div class="type-opt selected" data-type="group">
        <span class="icon">👥</span>
        <div class="label">Группа</div>
        <div class="desc">Пишут все</div>
      </div>
      <div class="type-opt" data-type="channel">
        <span class="icon">📢</span>
        <div class="label">Канал</div>
        <div class="desc">Пишут админы</div>
      </div>
    </div>
    <label>Название</label>
    <input type="text" id="roomName" placeholder="Например: Друзья" maxlength="60">
    <label>Описание (необязательно)</label>
    <textarea id="roomDesc" placeholder="О чём этот чат?" maxlength="200"></textarea>
    <button class="primary-btn" id="createSubmit">Создать</button>
    <button class="cancel-btn" id="createCancel">Отмена</button>
  </div>
</div>

<div class="modal-overlay" id="profileModal" style="display:none">
  <div class="modal-card">
    <h2>Мой профиль</h2>
    <div class="sub">Измените аватар и имя</div>
    <div class="avatar-editor">
      <div class="avatar-preview" id="avatarPreview"></div>
      <button class="avatar-upload-btn" id="avatarUploadBtn">📷 Загрузить фото</button>
      <button class="avatar-remove-btn" id="avatarRemoveBtn" style="display:none">Удалить фото</button>
    </div>
    <label>Имя</label>
    <input type="text" id="profileName" maxlength="30">
    <button class="primary-btn" id="profileSave">Сохранить</button>
    <button class="cancel-btn" id="profileCancel">Отмена</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Чаты</h1>
      <div class="header-btns">
        <button class="icon-round" id="notifyBtn" title="Уведомления">🔔</button>
        <button class="icon-round" id="createRoomBtn" title="Создать группу или канал">+</button>
        <div class="me-avatar" id="meAvatar" title="Мой профиль"></div>
      </div>
    </div>
    <div class="chats" id="chats"></div>
  </aside>

  <main class="chat-window">
    <header class="chat-header">
      <button class="icon-btn back-btn" id="backBtn" title="Назад">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="avatar" id="headerAvatar"></div>
      <div class="header-info">
        <h2 id="headerName">Общий чат</h2>
        <p id="headerStatus">все в сети</p>
      </div>
      <div class="header-actions" id="headerActions"></div>
    </header>

    <div class="messages" id="messages"></div>
    <div class="pending-file" id="pendingFile"></div>

    <div class="input-area">
      <button class="icon-btn" title="Прикрепить файл" id="attachBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fileInput" style="display:none">
      <div class="input-wrapper">
        <textarea id="messageInput" placeholder="Напишите сообщение..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" title="Отправить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const socket = io({ reconnection: true, reconnectionDelay: 1000, reconnectionAttempts: Infinity });

const PALETTE = [
  ['#ff6b6b','#ee5a6f'], ['#4facfe','#00f2fe'], ['#43e97b','#38f9d7'],
  ['#fa709a','#fee140'], ['#a18cd1','#fbc2eb'], ['#f093fb','#f5576c'],
  ['#5ee7df','#b490ca'], ['#ff9a9e','#fecfef'], ['#ffecd2','#fcb69f'],
  ['#667eea','#764ba2'], ['#30cfd0','#330867'], ['#f6d365','#fda085']
];

let me = null;
let allMessages = [];
let users = [];
let rooms = [];
let currentRoomId = 'public';
let unread = {};
let pendingFile = null;
let typingTimeout = null;
let typingUsers = {};
let connected = false;
let pushEnabled = false;
let listenersRegistered = false;
let profileDraft = null;

const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const chatsEl = $('chats');
const inputEl = $('messageInput');
const sendBtn = $('sendBtn');
const fileInput = $('fileInput');
const pendingFileEl = $('pendingFile');

function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
function formatSize(bytes) { if (bytes < 1024) return bytes + ' Б'; if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ'; return (bytes / 1024 / 1024).toFixed(1) + ' МБ'; }
function toast(text, ms = 2600) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), ms); }
function chatKeyFor(msg) { if (msg.to === 'public') return 'public'; if (msg.to.startsWith('r_')) return msg.to; return msg.from === me.userId ? msg.to : msg.from; }
function urlBase64ToUint8Array(base64String) { const padding = '='.repeat((4 - base64String.length % 4) % 4); const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/'); const rawData = window.atob(base64); const out = new Uint8Array(rawData.length); for (let i = 0; i < rawData.length; ++i) out[i] = rawData.charCodeAt(i); return out; }
function avatarHtml(user) { if (user && user.avatar) return `<img src="${user.avatar}" alt="">`; return escapeHtml(user.initials || '?'); }
function avatarStyle(user) { return user.avatar ? 'background:#eef0f8' : `background:${user.color}`; }

const savedMe = (() => { try { return JSON.parse(localStorage.getItem('messenger_me') || 'null'); } catch { return null; } })();
if (savedMe && savedMe.name) $('nameInput').value = savedMe.name;
$('nameInput').focus();
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameSubmit').click(); });

$('nameSubmit').onclick = () => {
  const name = $('nameInput').value.trim();
  if (!name) { toast('Введите имя'); return; }
  if (savedMe && savedMe.name === name) { me = savedMe; }
  else {
    const userId = savedMe?.userId || ('u_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36));
    const colors = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    const initials = name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || name.slice(0, 2).toUpperCase();
    me = { userId, name, color: `linear-gradient(135deg,${colors[0]},${colors[1]})`, initials, avatar: null };
    localStorage.setItem('messenger_me', JSON.stringify(me));
  }
  $('nameModal').style.display = 'none';
  $('app').style.display = 'flex';
  renderMeAvatar();
  registerSocketListeners();
  if (socket.connected) sendJoin();
  initPushState();
};

function sendJoin() {
  if (!me) return;
  socket.emit('join', { userId: me.userId, name: me.name, color: me.color, initials: me.initials });
  console.log('📤 Отправлен join:', me.name, me.userId);
}

function registerSocketListeners() {
  if (listenersRegistered) return;
  listenersRegistered = true;

  socket.on('connect', () => { connected = true; console.log('✅ Socket подключён:', socket.id); sendJoin(); });
  socket.on('disconnect', reason => { connected = false; console.warn('⚠️ Socket отключён:', reason); toast('⚠️ Соединение потеряно'); });
  socket.on('connect_error', err => { console.error('❌ Ошибка:', err.message); toast('❌ Ошибка подключения'); });
  socket.io.on('reconnect', () => toast('✅ Соединение восстановлено'));

  socket.on('history', msgs => { allMessages = Array.isArray(msgs) ? msgs : []; renderMessages(); renderChats(); });
  socket.on('rooms', list => { rooms = list || []; renderChats(); updateHeader(); updateInputState(); });
  socket.on('users', list => { users = list || []; renderChats(); updateHeader(); });

  socket.on('user-updated', ({ userId, user }) => {
    const idx = users.findIndex(u => u.userId === userId);
    if (idx >= 0) users[idx] = { ...users[idx], ...user };
    if (userId === me.userId) {
      if (user.avatar !== undefined) me.avatar = user.avatar;
      if (user.name) me.name = user.name;
      if (user.initials) me.initials = user.initials;
      if (user.color) me.color = user.color;
      localStorage.setItem('messenger_me', JSON.stringify(me));
      renderMeAvatar();
    }
    renderChats(); renderMessages(); updateHeader();
  });

  socket.on('room-created', room => { toast(`✅ ${room.type === 'channel' ? 'Канал' : 'Группа'} создан(а)`); openChat(room.id); });
  socket.on('error-msg', ({ text }) => toast('⛔ ' + text));

  socket.on('message', msg => {
    addMessage(msg);
    if (msg.from !== me.userId) {
      socket.emit('delivered', { userId: me.userId, messageIds: [msg.id] });
      const key = chatKeyFor(msg);
      if (key === currentRoomId && !document.hidden) {
        setTimeout(() => socket.emit('read', { userId: me.userId, messageIds: [msg.id] }), 500);
      }
      if ((document.hidden || key !== currentRoomId) && Notification.permission === 'granted' && !pushEnabled) {
        try {
          const n = new Notification(msg.fromName || 'Новое сообщение', { body: msg.file ? '📎 ' + msg.file.name : msg.text.slice(0, 120), tag: key });
          n.onclick = () => { window.focus(); openChat(key); };
        } catch (e) {}
      }
    }
  });

  socket.on('message-update', updated => {
    const idx = allMessages.findIndex(m => m.id === updated.id);
    if (idx >= 0) { allMessages[idx] = updated; if (chatKeyFor(updated) === currentRoomId) renderMessages(); }
  });

  socket.on('typing', ({ from, fromName, to }) => {
    if (from === me.userId) return;
    const key = to === 'public' ? 'public' : (to.startsWith('r_') ? to : from);
    typingUsers[from] = { name: fromName, key };
    if (key === currentRoomId) renderMessages();
    clearTimeout(typingUsers[from]._t);
    typingUsers[from]._t = setTimeout(() => { delete typingUsers[from]; if (key === currentRoomId) renderMessages(); }, 3000);
  });
}

function addMessage(msg) {
  if (allMessages.some(m => m.id === msg.id)) return;
  allMessages.push(msg);
  const key = chatKeyFor(msg);
  if (key === currentRoomId) renderMessages();
  else if (msg.from !== me.userId) unread[key] = (unread[key] || 0) + 1;
  renderChats();
}

function getChatMessages(chatId) {
  if (chatId === 'public') return allMessages.filter(m => m.to === 'public');
  if (chatId.startsWith('r_')) return allMessages.filter(m => m.to === chatId);
  return allMessages.filter(m => (m.from === me.userId && m.to === chatId) || (m.from === chatId && m.to === me.userId));
}

function renderStatus(m, chatId) {
  if (m.from !== me.userId) return '';
  const isPersonal = !chatId.startsWith('r_') && chatId !== 'public';
  const room = rooms.find(r => r.id === chatId);
  const recipients = isPersonal ? [chatId] : (chatId === 'public' ? users.map(u => u.userId).filter(x => x !== me.userId) : (room?.members || []).filter(x => x !== me.userId));
  const totalRecipients = recipients.length;
  const readCount = (m.readBy || []).filter(x => x !== me.userId).length;
  const deliveredCount = (m.deliveredTo || []).filter(x => x !== me.userId).length;
  if (isPersonal) {
    if (readCount >= 1) return `<span class="msg-status read" title="Прочитано">✓✓</span>`;
    if (deliveredCount >= 1) return `<span class="msg-status" title="Доставлено">✓✓</span>`;
    return `<span class="msg-status" title="Отправлено">✓</span>`;
  }
  if (totalRecipients === 0) return `<span class="msg-status" title="Отправлено">✓</span>`;
  const isAllRead = readCount >= totalRecipients;
  const cls = isAllRead ? 'msg-status read' : 'msg-status';
  return `<span class="${cls}" title="Прочитано: ${readCount}/${totalRecipients}">✓✓ <span class="msg-reads">${readCount}/${totalRecipients}</span></span>`;
}

function renderMessages() {
  const msgs = getChatMessages(currentRoomId);
  messagesEl.innerHTML = '';
  if (!msgs.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-chat';
    empty.innerHTML = `<div class="em">💬</div><p>Пока нет сообщений.<br>Начните первым!</p>`;
    messagesEl.appendChild(empty);
  } else {
    let lastFrom = null;
    msgs.forEach(m => {
      const isMe = m.from === me.userId;
      const isGroup = currentRoomId === 'public' || currentRoomId.startsWith('r_');
      const showSender = !isMe && isGroup && m.from !== lastFrom;
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + (isMe ? 'me' : 'them');
      if (showSender) {
        const u = users.find(x => x.userId === m.from);
        const name = document.createElement('div');
        name.className = 'sender-name';
        if (u && u.avatar) name.innerHTML = `<img src="${u.avatar}" class="sender-avatar" alt=""> <span>${escapeHtml(m.fromName || 'Аноним')}</span>`;
        else name.textContent = m.fromName || 'Аноним';
        if (u && u.color) { const c = u.color.match(/#[0-9a-f]{6}/i); if (c) name.style.color = c[0]; }
        wrap.appendChild(name);
      }
      const bubble = document.createElement('div');
      bubble.className = 'msg ' + (isMe ? 'outgoing' : 'incoming');
      let html = '';
      if (m.file) {
        if (m.file.type && m.file.type.startsWith('image/')) html += `<img class="msg-image" src="${m.file.url}" alt="${escapeHtml(m.file.name)}" loading="lazy" data-img="${m.file.url}">`;
        else html += `<a class="msg-file" href="${m.file.url}" download="${escapeHtml(m.file.name)}"><span class="file-icon">📎</span><span class="file-details"><span class="file-name">${escapeHtml(m.file.name)}</span><span class="file-size">${formatSize(m.file.size)}</span></span></a>`;
      }
      if (m.text) html += `<div>${escapeHtml(m.text).replace(/\n/g, '<br>')}</div>`;
      html += `<div class="msg-footer"><span class="msg-time">${m.time}</span>${renderStatus(m, currentRoomId)}</div>`;
      bubble.innerHTML = html;
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      lastFrom = m.from;
    });
  }
  const typing = Object.entries(typingUsers).filter(([, v]) => v.key === currentRoomId);
  if (typing.length) {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
  }
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function renderChats() {
  chatsEl.innerHTML = '';
  const pubMsgs = getChatMessages('public');
  const lastPub = pubMsgs[pubMsgs.length - 1];
  chatsEl.appendChild(renderRoomItem({ id: 'public', name: 'Общий чат', emoji: '🌐', gradient: 'linear-gradient(135deg,#667eea,#764ba2)' }, lastPub, 'public'));

  const myRooms = rooms.filter(r => r.members.includes(me.userId));
  const myChannels = myRooms.filter(r => r.type === 'channel');
  const myGroups = myRooms.filter(r => r.type === 'group');

  if (myChannels.length) {
    chatsEl.appendChild(sectionLabel(`📢 Каналы · ${myChannels.length}`));
    myChannels.forEach(r => chatsEl.appendChild(renderRoomItem(r, getChatMessages(r.id).slice(-1)[0], r.id, '📢')));
  }
  if (myGroups.length) {
    chatsEl.appendChild(sectionLabel(`👥 Группы · ${myGroups.length}`));
    myGroups.forEach(r => chatsEl.appendChild(renderRoomItem(r, getChatMessages(r.id).slice(-1)[0], r.id, '👥')));
  }

  const available = rooms.filter(r => !r.members.includes(me.userId));
  if (available.length) {
    chatsEl.appendChild(sectionLabel(`Доступные · ${available.length}`));
    available.forEach(r => {
      const item = renderRoomItem(r, null, null, r.type === 'channel' ? '📢' : '👥');
      const btn = document.createElement('button');
      btn.className = 'join-btn'; btn.textContent = '+'; btn.title = 'Присоединиться';
      btn.onclick = e => { e.stopPropagation(); socket.emit('join-room', { roomId: r.id, userId: me.userId }); toast(`✅ Вы присоединились к "${r.name}"`); setTimeout(() => openChat(r.id), 150); };
      item.appendChild(btn);
      item.onclick = () => { socket.emit('join-room', { roomId: r.id, userId: me.userId }); setTimeout(() => openChat(r.id), 150); };
      chatsEl.appendChild(item);
    });
  }

  const others = users.filter(u => u.userId !== me.userId);
  if (others.length) {
    chatsEl.appendChild(sectionLabel(`💬 Личные · ${others.length}`));
    others.sort((a, b) => { if (a.online !== b.online) return a.online ? -1 : 1; return a.name.localeCompare(b.name, 'ru'); });
    others.forEach(u => chatsEl.appendChild(renderUserItem(u)));
  } else chatsEl.appendChild(sectionLabel('Пока никого нет'));
}

function sectionLabel(text) { const el = document.createElement('div'); el.className = 'section-label'; el.textContent = text; return el; }

function renderRoomItem(room, lastMsg, chatId, emoji = '🌐') {
  const item = document.createElement('div');
  item.className = 'chat-item' + (chatId && currentRoomId === chatId ? ' active' : '');
  const preview = lastMsg ? `${lastMsg.from === me.userId ? 'Вы: ' : (lastMsg.fromName ? escapeHtml(lastMsg.fromName) + ': ' : '')}${lastMsg.file ? '📎 ' + escapeHtml(lastMsg.file.name) : escapeHtml(lastMsg.text)}` : (room.description || 'Нет сообщений');
  item.innerHTML = `
    <div class="avatar" style="background:${room.gradient || room.color || 'linear-gradient(135deg,#667eea,#764ba2)'}"><span class="room-emoji">${emoji}</span></div>
    <div class="chat-info">
      <div class="chat-top"><span class="chat-name">${escapeHtml(room.name)}</span><span class="chat-time">${lastMsg ? lastMsg.time : ''}</span></div>
      <div class="chat-bottom"><span class="chat-preview">${preview}</span>${unread[chatId] ? `<span class="badge">${unread[chatId]}</span>` : ''}</div>
    </div>`;
  if (chatId) item.onclick = () => openChat(chatId);
  return item;
}

function renderUserItem(u) {
  const key = u.userId;
  const msgs = getChatMessages(key);
  const last = msgs.slice(-1)[0];
  const item = document.createElement('div');
  item.className = 'chat-item' + (currentRoomId === key ? ' active' : '');
  item.innerHTML = `
    <div class="avatar" style="${avatarStyle(u)}">${avatarHtml(u)}<span class="status ${u.online ? '' : 'offline'}"></span></div>
    <div class="chat-info">
      <div class="chat-top"><span class="chat-name">${escapeHtml(u.name)}</span><span class="chat-time">${last ? last.time : ''}</span></div>
      <div class="chat-bottom">
        <span class="chat-preview">${last ? `${last.from === me.userId ? 'Вы: ' : ''}${last.file ? '📎 ' + escapeHtml(last.file.name) : escapeHtml(last.text)}` : (u.online ? 'в сети' : 'был(а) недавно')}</span>
        ${unread[key] ? `<span class="badge">${unread[key]}</span>` : ''}
      </div>
    </div>`;
  item.onclick = () => openChat(key);
  return item;
}

function updateHeader() {
  const ha = $('headerAvatar'), hn = $('headerName'), hs = $('headerStatus'), actions = $('headerActions');
  actions.innerHTML = '';
  if (currentRoomId === 'public') {
    ha.innerHTML = '🌐'; ha.style.background = 'linear-gradient(135deg,#667eea,#764ba2)';
    hn.innerHTML = `Общий чат <span class="room-tag">Публичный</span>`;
    hs.textContent = `${users.length} участник${users.length === 1 ? '' : 'ов'}`; hs.className = 'plain'; return;
  }
  if (currentRoomId.startsWith('r_')) {
    const room = rooms.find(r => r.id === currentRoomId);
    if (!room) return;
    ha.innerHTML = `<span class="room-emoji">${room.type === 'channel' ? '📢' : '👥'}</span>`;
    ha.style.background = room.color;
    const isAdmin = room.admins.includes(me.userId);
    hn.innerHTML = `${escapeHtml(room.name)} <span class="room-tag">${room.type === 'channel' ? 'Канал' : 'Группа'}</span>`;
    const onlineCount = room.members.filter(m => users.find(u => u.userId === m && u.online)).length;
    hs.textContent = `${room.members.length} участник${room.members.length === 1 ? '' : 'ов'} · ${onlineCount} в сети${isAdmin ? ' · вы админ' : ''}`;
    hs.className = 'plain';
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'icon-btn danger'; leaveBtn.title = 'Покинуть';
    leaveBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`;
    leaveBtn.onclick = () => { if (confirm(`Покинуть "${room.name}"?`)) { socket.emit('leave-room', { roomId: room.id, userId: me.userId }); openChat('public'); } };
    actions.appendChild(leaveBtn); return;
  }
  const u = users.find(x => x.userId === currentRoomId);
  if (!u) { ha.textContent = '?'; ha.style.background = '#b0b4c3'; hn.textContent = 'Пользователь'; hs.textContent = 'недоступен'; hs.className = 'offline'; return; }
  ha.innerHTML = avatarHtml(u);
  ha.style.background = u.avatar ? '#eef0f8' : u.color;
  hn.textContent = u.name;
  hs.textContent = u.online ? 'в сети' : 'был(а) недавно';
  hs.className = u.online ? '' : 'offline';
}

function updateInputState() {
  if (currentRoomId.startsWith('r_')) {
    const room = rooms.find(r => r.id === currentRoomId);
    if (room && room.type === 'channel' && !room.admins.includes(me.userId)) {
      inputEl.disabled = true; inputEl.placeholder = 'Только администраторы могут публиковать';
      sendBtn.disabled = true; $('attachBtn').disabled = true; return;
    }
  }
  inputEl.disabled = false; inputEl.placeholder = 'Напишите сообщение...';
  sendBtn.disabled = false; $('attachBtn').disabled = false;
}

function openChat(id) {
  currentRoomId = id; unread[id] = 0;
  renderChats(); renderMessages(); updateHeader(); updateInputState(); markCurrentAsRead();
  if (window.innerWidth <= 720) $('sidebar').classList.add('hidden');
}

function markCurrentAsRead() {
  if (document.hidden) return;
  const msgs = getChatMessages(currentRoomId);
  const ids = msgs.filter(m => m.from !== me.userId && !(m.readBy || []).includes(me.userId)).map(m => m.id);
  if (ids.length) socket.emit('read', { userId: me.userId, messageIds: ids });
}

function renderMeAvatar() {
  const el = $('meAvatar');
  if (me.avatar) { el.innerHTML = `<img src="${me.avatar}" alt="">`; el.style.background = '#eef0f8'; }
  else { el.innerHTML = me.initials; el.style.background = me.color; }
}

function updateProfilePreview() {
  const preview = $('avatarPreview');
  if (profileDraft.avatar) { preview.innerHTML = `<img src="${profileDraft.avatar}" alt="">`; preview.style.background = '#eef0f8'; }
  else { preview.textContent = profileDraft.initials; preview.style.background = profileDraft.color; }
  $('avatarRemoveBtn').style.display = profileDraft.avatar ? 'inline-block' : 'none';
}

$('meAvatar').onclick = () => {
  profileDraft = { ...me };
  $('profileName').value = profileDraft.name;
  updateProfilePreview();
  $('profileModal').style.display = 'flex';
  setTimeout(() => $('profileName').focus(), 100);
};

$('avatarUploadBtn').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('Максимум 5 МБ'); return; }
    if (!f.type.startsWith('image/')) { toast('Только изображения'); return; }
    const btn = $('avatarUploadBtn');
    btn.textContent = 'Загрузка...'; btn.disabled = true;
    try {
      const data = await uploadFile(f);
      profileDraft.avatar = data.url;
      updateProfilePreview();
      toast('✅ Фото загружено, не забудьте сохранить');
    } catch (err) { toast('Ошибка: ' + err.message); }
    finally { btn.textContent = '📷 Загрузить фото'; btn.disabled = false; }
  };
  input.click();
};

$('avatarRemoveBtn').onclick = () => { profileDraft.avatar = null; updateProfilePreview(); };

$('profileSave').onclick = () => {
  const newName = $('profileName').value.trim();
  if (!newName) { toast('Введите имя'); return; }
  if (newName !== me.name) {
    me.name = newName;
    me.initials = newName.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || newName.slice(0, 2).toUpperCase();
    if (!me.avatar) { const colors = PALETTE[Math.floor(Math.random() * PALETTE.length)]; me.color = `linear-gradient(135deg,${colors[0]},${colors[1]})`; }
  }
  me.avatar = profileDraft.avatar;
  localStorage.setItem('messenger_me', JSON.stringify(me));
  socket.emit('update-profile', { userId: me.userId, name: me.name, color: me.color, initials: me.initials, avatar: me.avatar || null });
  renderMeAvatar();
  $('profileModal').style.display = 'none';
  toast('✅ Профиль обновлён');
};

$('profileCancel').onclick = () => { profileDraft = null; $('profileModal').style.display = 'none'; };
$('profileName').addEventListener('keydown', e => { if (e.key === 'Enter') $('profileSave').click(); });

async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/upload', { method: 'POST', body: fd });
  if (!res.ok) throw new Error('Ошибка загрузки');
  return await res.json();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text && !pendingFile) return;
  if (!socket.connected) { toast('⚠️ Нет соединения с сервером'); return; }
  if (inputEl.disabled) return;
  let fileData = null;
  if (pendingFile) {
    sendBtn.classList.add('uploading'); sendBtn.disabled = true;
    try { fileData = await uploadFile(pendingFile); }
    catch (e) { toast('Ошибка: ' + e.message); sendBtn.classList.remove('uploading'); sendBtn.disabled = false; updateInputState(); return; }
  }
  const ts = Date.now();
  const msg = { id: 'm_' + ts + '_' + Math.random().toString(36).slice(2, 8), from: me.userId, fromName: me.name, to: currentRoomId, text, file: fileData, timestamp: ts };
  addMessage({ ...msg, time: new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), deliveredTo: [], readBy: [] });
  socket.emit('message', msg);
  inputEl.value = ''; inputEl.style.height = 'auto';
  pendingFile = null; renderPendingFile();
  sendBtn.classList.remove('uploading'); updateInputState(); inputEl.focus();
}

function renderPendingFile() {
  if (!pendingFile) { pendingFileEl.style.display = 'none'; pendingFileEl.innerHTML = ''; return; }
  pendingFileEl.style.display = 'block';
  const isImage = pendingFile.type.startsWith('image/');
  const preview = isImage ? `<img class="pending-preview-img" src="${URL.createObjectURL(pendingFile)}" alt="">` : `<div class="file-icon" style="font-size:28px">📎</div>`;
  pendingFileEl.innerHTML = `<div class="pending-file-inner">${preview}<div class="pending-file-info"><div class="name">${escapeHtml(pendingFile.name)}</div><div class="size">${formatSize(pendingFile.size)}</div></div><button class="pending-remove" title="Убрать">×</button></div>`;
  pendingFileEl.querySelector('.pending-remove').onclick = () => { pendingFile = null; renderPendingFile(); };
}

function pickFile(file) {
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { toast('Файл слишком большой (макс. 25 МБ)'); return; }
  pendingFile = file; renderPendingFile();
}

$('attachBtn').onclick = () => fileInput.click();
fileInput.onchange = e => { pickFile(e.target.files[0]); fileInput.value = ''; };

['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  if (!e.target.closest('.chat-window')) return;
  e.preventDefault();
  document.querySelectorAll('.drop-overlay').forEach(d => d.classList.add('active'));
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, () => {
  document.querySelectorAll('.drop-overlay').forEach(d => d.classList.remove('active'));
}));
document.addEventListener('drop', e => {
  if (!e.target.closest('.chat-window')) return;
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f) pickFile(f);
});

sendBtn.onclick = sendMessage;
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  if (!socket.connected) return;
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => { socket.emit('typing', { to: currentRoomId, from: me.userId, fromName: me.name }); }, 200);
});

let createType = 'group';
$('createRoomBtn').onclick = () => {
  $('roomName').value = ''; $('roomDesc').value = ''; createType = 'group';
  document.querySelectorAll('.type-opt').forEach(o => o.classList.toggle('selected', o.dataset.type === 'group'));
  $('createModal').style.display = 'flex';
  setTimeout(() => $('roomName').focus(), 100);
};
document.querySelectorAll('.type-opt').forEach(opt => {
  opt.onclick = () => {
    createType = opt.dataset.type;
    document.querySelectorAll('.type-opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
  };
});
$('createCancel').onclick = () => $('createModal').style.display = 'none';
$('createSubmit').onclick = () => {
  const name = $('roomName').value.trim();
  if (!name) { toast('Введите название'); return; }
  socket.emit('create-room', { name, type: createType, description: $('roomDesc').value.trim(), creator: me.userId });
  $('createModal').style.display = 'none';
};
$('roomName').addEventListener('keydown', e => { if (e.key === 'Enter') $('createSubmit').click(); });

async function initPushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { $('notifyBtn').style.display = 'none'; return; }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const sub = await reg.pushManager.getSubscription();
    pushEnabled = !!sub;
    $('notifyBtn').classList.toggle('on', pushEnabled);
    $('notifyBtn').textContent = pushEnabled ? '🔔' : '🔕';
    $('notifyBtn').title = pushEnabled ? 'Уведомления включены' : 'Включить уведомления';
  } catch (e) { console.warn(e); }
}

$('notifyBtn').onclick = async () => {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast('Push не поддерживается'); return; }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      await fetch('/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: me.userId, endpoint: sub.endpoint }) });
      await sub.unsubscribe();
      pushEnabled = false;
      $('notifyBtn').classList.remove('on'); $('notifyBtn').textContent = '🔕'; $('notifyBtn').title = 'Включить уведомления';
      toast('🔕 Уведомления отключены'); return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Уведомления запрещены'); return; }
    const { key } = await fetch('/vapid-public-key').then(r => r.json());
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
    await fetch('/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: me.userId, subscription: sub }) });
    pushEnabled = true;
    $('notifyBtn').classList.add('on'); $('notifyBtn').textContent = '🔔'; $('notifyBtn').title = 'Уведомления включены';
    toast('✅ Уведомления включены');
  } catch (e) { console.error(e); toast('Ошибка: ' + e.message); }
};

messagesEl.addEventListener('click', e => {
  const img = e.target.closest('[data-img]');
  if (!img) return;
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${img.dataset.img}" alt="">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
});

$('backBtn').onclick = () => $('sidebar').classList.remove('hidden');

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { markCurrentAsRead(); document.title = 'Мессенджер'; }
});

socket.on('connect', () => { connected = true; console.log('✅ Socket подключён:', socket.id); });
socket.on('disconnect', () => { connected = false; console.log('⚠️ Socket отключён'); });
</script>
