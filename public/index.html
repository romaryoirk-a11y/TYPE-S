<!DOCTYPE html>
<html>
  <head>
  </head>
  <body>
    <script>
     // ============================================================
// DOM REFS + INIT UI
// ============================================================
function initUI() {
  // Auth tabs
  document.querySelectorAll('#authTabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#authTabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      $('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      $('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    };
  });

  // Register form
  $('regUsername').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^a-zA-Z0-9_]/g, '').replace(/^@+/, '');
    const v = validateUsername(e.target.value);
    const h = $('regUsernameHint');
    h.textContent = v.msg;
    h.className = 'input-hint ' + v.cls;
  });
  $('registerBtn').onclick = () => {
    const name = $('regName').value.trim();
    const username = $('regUsername').value.trim().replace(/^@/, '');
    const password = $('regPassword').value;
    if (!name) return toast(t('enter_name'));
    const v = validateUsername(username);
    if (!v.ok) return toast(t('invalid_username'));
    if (!password || password.length < 4) return toast(t('password_hint'));
    const colors = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    const initials = name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || name.slice(0, 2).toUpperCase();
    socket.emit('register', {
      name, username, password,
      color: 'linear-gradient(135deg,' + colors[0] + ',' + colors[1] + ')',
      initials
    });
  };

  // Login form
  $('loginBtn').onclick = () => {
    const username = $('loginUsername').value.trim().replace(/^@/, '');
    const password = $('loginPassword').value;
    if (!username) return toast(t('enter_username'));
    if (!password) return toast(t('password_hint'));
    socket.emit('login', { username, password });
  };
  $('loginUsername').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginPassword').focus(); });
  $('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('regPassword').addEventListener('keydown', e => { if (e.key === 'Enter') $('registerBtn').click(); });

  // Account menu
  $('meAvatar').onclick = () => { accountMenu.classList.add('open'); updateAccountMenu(); };
  $('accountMenuBack').onclick = () => accountMenu.classList.remove('open');

  $('menuProfile').onclick = () => {
    accountMenu.classList.remove('open');
    setTimeout(() => openProfile(), 200);
  };
  $('menuTheme').onclick = () => {
    accountMenu.classList.remove('open');
    setTimeout(() => { updateThemePicker(); $('themeModal').style.display = 'flex'; }, 200);
  };
  $('menuStats').onclick = () => {
    accountMenu.classList.remove('open');
    setTimeout(openStats, 200);
  };
  $('menuPassword').onclick = () => {
    accountMenu.classList.remove('open');
    setTimeout(() => {
      $('oldPassword').value = '';
      $('newPassword').value = '';
      $('passwordModal').style.display = 'flex';
    }, 200);
  };
  $('menuNotify').onclick = () => {
    accountMenu.classList.remove('open');
    setTimeout(toggleNotifications, 200);
  };
  $('menuLogout').onclick = () => {
    if (!confirm(t('logout_confirm'))) return;
    try {
      localStorage.removeItem('messenger_me');
      localStorage.removeItem('messenger_token');
    } catch (e) {}
    location.reload();
  };

  // Profile modal
  $('avatarUploadBtn').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 5 * 1024 * 1024) return toast(t('max_5mb'));
      if (f.type.indexOf('image/') !== 0) return toast(t('only_images'));
      const btn = $('avatarUploadBtn');
      btn.textContent = '...'; btn.disabled = true;
      try {
        const data = await uploadFile(f);
        profileDraft.avatar = data.url;
        updateProfilePreview();
        toast(t('photo_uploaded'));
      } catch (err) { toast(t('error') + ': ' + err.message); }
      finally { btn.textContent = t('upload_photo'); btn.disabled = false; }
    };
    inp.click();
  };
  $('avatarRemoveBtn').onclick = () => { profileDraft.avatar = null; updateProfilePreview(); };
  $('profileSave').onclick = () => {
    const newName = $('profileName').value.trim();
    if (!newName) return toast(t('enter_name'));
    if (newName !== me.name) {
      me.name = newName;
      me.initials = newName.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || newName.slice(0, 2).toUpperCase();
    }
    me.avatar = profileDraft.avatar;
    saveMeLocal();
    socket.emit('update-profile', { userId: me.userId, name: me.name, color: me.color, initials: me.initials, avatar: me.avatar || null });
    renderMeAvatar();
    $('profileModal').style.display = 'none';
    toast(t('profile_updated'));
  };
  $('profileCancel').onclick = () => { profileDraft = null; $('profileModal').style.display = 'none'; };

  // Password modal
  $('changePasswordBtn').onclick = () => {
    const oldP = $('oldPassword').value;
    const newP = $('newPassword').value;
    if (!newP || newP.length < 4) return toast(t('password_hint'));
    socket.emit('change-password', { userId: me.userId, oldPassword: oldP, newPassword: newP });
    $('passwordModal').style.display = 'none';
  };
  $('passwordCancel').onclick = () => $('passwordModal').style.display = 'none';

  // Theme modal
  document.querySelectorAll('.theme-opt').forEach(opt => {
    opt.onclick = () => {
      const theme = opt.dataset.themeVal;
      userSettings.theme = theme;
      applyTheme(theme, userSettings.accent);
      updateThemePicker();
      saveSettings();
    };
  });
  $('themeClose').onclick = () => $('themeModal').style.display = 'none';

  // Lang picker
  document.querySelectorAll('.lang-opt').forEach(opt => {
    opt.onclick = () => {
      const lang = opt.dataset.lang;
      userSettings.language = lang;
      applyLang(lang);
      saveSettings();
      updateLangPicker();
      renderChats(); updateHeader(); renderMessages();
      updateAccountMenu();
    };
  });

  // Stats
  $('statsClose').onclick = () => $('statsModal').style.display = 'none';

  // Members
  $('membersClose').onclick = () => $('membersModal').style.display = 'none';

  // Invite link
  $('inviteLinkClose').onclick = () => $('inviteLinkModal').style.display = 'none';
  $('copyInviteLink').onclick = () => {
    const inp = $('inviteLinkInput');
    inp.select();
    try { document.execCommand('copy'); toast(t('copied')); } catch (e) {}
    if (navigator.clipboard) navigator.clipboard.writeText(inp.value);
  };

  // Search user
  $('searchUserBtn').onclick = () => {
    $('searchUserInput').value = '';
    $('searchResults').innerHTML = '<div class="empty-search">' + t('start_typing') + '</div>';
    $('searchModal').style.display = 'flex';
  };
  $('searchCancel').onclick = () => $('searchModal').style.display = 'none';
  let searchDebounce = null;
  $('searchUserInput').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^a-zA-Z0-9_]/g, '');
    clearTimeout(searchDebounce);
    const q = e.target.value.trim();
    if (!q) { $('searchResults').innerHTML = '<div class="empty-search">' + t('start_typing') + '</div>'; return; }
    searchDebounce = setTimeout(() => {
      if (me) socket.emit('search-user', { query: q, byUserId: me.userId });
    }, 250);
  });

  // Search messages
  $('msgSearchBtn').onclick = () => {
    $('msgSearchInput').value = '';
    $('msgSearchResults').innerHTML = '<div class="empty-search">' + t('min_2_chars') + '</div>';
    $('msgSearchModal').style.display = 'flex';
    setTimeout(() => $('msgSearchInput').focus(), 100);
  };
  $('msgSearchCancel').onclick = () => $('msgSearchModal').style.display = 'none';
  let msgSearchDebounce = null;
  $('msgSearchInput').addEventListener('input', e => {
    clearTimeout(msgSearchDebounce);
    const q = e.target.value.trim();
    if (q.length < 2) { $('msgSearchResults').innerHTML = '<div class="empty-search">' + t('min_2_chars') + '</div>'; return; }
    msgSearchDebounce = setTimeout(() => {
      if (me) socket.emit('search-messages', { userId: me.userId, query: q });
    }, 300);
  });

  // Create room
  $('createRoomBtn').onclick = () => {
    $('roomName').value = ''; $('roomDesc').value = ''; $('roomInvite').value = '';
    document.querySelectorAll('.type-opt[data-type]').forEach(o => o.classList.toggle('selected', o.dataset.type === 'group'));
    $('createModal').style.display = 'flex';
  };
  document.querySelectorAll('.type-opt[data-type]').forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll('.type-opt[data-type]').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    };
  });
  $('createCancel').onclick = () => $('createModal').style.display = 'none';
  $('createSubmit').onclick = () => {
    const name = $('roomName').value.trim();
    if (!name) return toast(t('enter_room_name'));
    const typeOpt = document.querySelector('.type-opt[data-type].selected');
    const type = typeOpt ? typeOpt.dataset.type : 'group';
    const invites = $('roomInvite').value.split(',').map(s => s.trim()).filter(Boolean);
    socket.emit('create-room', { name, type, description: $('roomDesc').value.trim(), creator: me.userId, inviteUsernames: invites });
    $('createModal').style.display = 'none';
  };

  // Invite to room
  $('inviteCancel').onclick = () => $('inviteModal').style.display = 'none';
  $('inviteSubmit').onclick = () => {
    const usernames = $('inviteInput').value.split(',').map(s => s.trim()).filter(Boolean);
    if (!usernames.length) return toast(t('enter_username'));
    socket.emit('invite-to-room', { roomId: currentRoomId, byUserId: me.userId, usernames });
    $('inviteModal').style.display = 'none';
  };

  // Pinned bar
  $('pinnedBarClose').onclick = () => {
    $('pinnedBar').classList.remove('show');
  };

  // Filter
  $('filterInput').addEventListener('input', e => { currentFilter = e.target.value; renderChats(); });

  // Attach
  $('attachBtn').onclick = () => fileInput.click();
  fileInput.onchange = e => { pickFile(e.target.files[0]); fileInput.value = ''; };
  sendBtn.onclick = sendMessage;
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    if (!socket.connected || !me) return;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      socket.emit('typing', { to: currentRoomId, from: me.userId, fromName: me.name });
    }, 200);
  });

  // Back button
  $('backBtn').onclick = () => $('sidebar').classList.remove('hidden');

  // Visibility
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { markCurrentAsRead(); document.title = 'Messenger'; }
  });

  // Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (accountMenu && accountMenu.classList.contains('open')) accountMenu.classList.remove('open');
    }
  });

  // Drag & drop
  ['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
    if (!e.target.closest('.chat-window')) return;
    e.preventDefault();
  }));
  document.addEventListener('drop', e => {
    if (!e.target.closest('.chat-window')) return;
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) pickFile(f);
  });

  // Context menu on messages
  messagesEl.addEventListener('contextmenu', e => {
    const wrap = e.target.closest('.msg-wrap');
    if (!wrap) return;
    e.preventDefault();
    openMessageActions(wrap.dataset.msgId, e.clientX, e.clientY);
  });
  let longPressTimer = null;
  messagesEl.addEventListener('touchstart', e => {
    const wrap = e.target.closest('.msg-wrap');
    if (!wrap) return;
    longPressTimer = setTimeout(() => {
      const rect = wrap.getBoundingClientRect();
      openMessageActions(wrap.dataset.msgId, rect.left + rect.width/2, rect.top);
    }, 500);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => {
    messagesEl.addEventListener(ev, () => clearTimeout(longPressTimer), { passive: true });
  });

  // Click outside context menu
  document.addEventListener('click', e => {
    if (activeContext && !e.target.closest('.context-menu') && !e.target.closest('.reactions-bar')) {
      activeContext.remove(); activeContext = null;
    }
  });
  document.addEventListener('scroll', () => {
    if (activeContext) { activeContext.remove(); activeContext = null; }
  }, true);

  // Lightbox
  messagesEl.addEventListener('click', e => {
    const img = e.target.closest('[data-img]');
    if (!img) return;
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = '<img src="' + img.dataset.img + '" alt="">';
    lb.onclick = () => lb.remove();
    document.body.appendChild(lb);
  });

  // Mobile height
  function isMobile() { return window.innerWidth <= 720; }
  function syncAppHeight() {
    if (!isMobile()) { const app = $('app'); if (app) app.style.height = ''; return; }
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    const app = $('app'); if (app) app.style.height = h + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncAppHeight);
    window.visualViewport.addEventListener('scroll', syncAppHeight);
  }
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', () => setTimeout(syncAppHeight, 300));
  inputEl.addEventListener('focus', () => {
    setTimeout(() => { syncAppHeight(); messagesEl.scrollTop = messagesEl.scrollHeight; }, 300);
  });
  inputEl.addEventListener('blur', () => setTimeout(syncAppHeight, 100));
  syncAppHeight();
}

// ============================================================
// AUTH: показать экран входа
// ============================================================
function showAuth(tab) {
  $('app').style.display = 'none';
  $('authModal').style.display = 'flex';
  document.querySelectorAll('#authTabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  $('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  setTimeout(() => {
    if (tab === 'login') $('loginUsername').focus();
    else $('regName').focus();
  }, 100);
}

// ============================================================
// SOCKET LISTENERS
// ============================================================
function registerSocketListeners() {
  if (listenersRegistered) return;
  listenersRegistered = true;

  socket.on('connect', () => {
    connected = true;
    if (me && sessionToken) {
      socket.emit('auto-login', { userId: me.userId, token: sessionToken });
    }
  });
  socket.on('disconnect', () => { connected = false; toast(t('connection_lost')); });
  socket.on('connect_error', () => {});
  socket.io.on('reconnect', () => toast(t('connection_restored')));

  socket.on('auth-error', ({ text }) => {
    try {
      localStorage.removeItem('messenger_me');
      localStorage.removeItem('messenger_token');
    } catch (e) {}
    me = null;
    sessionToken = null;
    showAuth('login');
    toast('⚠️ ' + text, 4000);
  });

  socket.on('joined', ({ userId, user, token, isNewAccount }) => {
    me = user;
    me.userId = userId;
    sessionToken = token;
    saveMeLocal();
    try { localStorage.setItem('messenger_token', token); } catch (e) {}

    // Применяем настройки с сервера (если есть)
    if (user.settings) {
      userSettings = Object.assign(userSettings, user.settings);
      applyTheme(userSettings.theme, userSettings.accent);
      applyLang(userSettings.language);
      buildAccentPicker();
      updateLangPicker();
      updateThemePicker();
    }
    if (Array.isArray(user.mutedChats)) mutedChats = user.mutedChats;

    $('authModal').style.display = 'none';
    $('app').style.display = 'flex';
    renderMeAvatar();
    initPushState();
    hideBoot();

    toast(isNewAccount ? t('welcome_toast_created', { u: user.username }) : t('welcome_toast_back', { n: user.name }), 3000);

    // Если был invite-code в URL — активируем
    const code = new URLSearchParams(location.search).get('invite');
    if (code) {
      socket.emit('redeem-invite', { code, userId: me.userId });
      try { history.replaceState(null, '', '/'); } catch (e) {}
    }
  });

  socket.on('history', msgs => { allMessages = Array.isArray(msgs) ? msgs : []; renderMessages(); renderChats(); });
  socket.on('rooms', list => { rooms = list || []; renderChats(); updateHeader(); updateInputState(); });
  socket.on('users', list => { users = list || []; renderChats(); updateHeader(); });

  socket.on('user-updated', ({ userId, user }) => {
    const idx = users.findIndex(u => u.userId === userId);
    if (idx >= 0) users[idx] = Object.assign({}, users[idx], user);
    if (me && userId === me.userId) {
      if (user.avatar !== undefined) me.avatar = user.avatar;
      if (user.name) me.name = user.name;
      if (user.initials) me.initials = user.initials;
      if (user.color) me.color = user.color;
      saveMeLocal();
      renderMeAvatar();
      if (accountMenu.classList.contains('open')) updateAccountMenu();
    }
    renderChats(); renderMessages(); updateHeader();
  });

  socket.on('settings-updated', ({ settings }) => {
    userSettings = Object.assign(userSettings, settings);
    saveSettings();
  });

  socket.on('mutes-updated', ({ mutedChats: m }) => {
    mutedChats = m || [];
    if (me) me.mutedChats = mutedChats;
    saveMeLocal();
    renderChats();
    updateHeader();
  });

  socket.on('toast-msg', ({ text }) => toast(text));
  socket.on('error-msg', ({ text }) => toast('⛔ ' + text));

  socket.on('room-created', room => {
    const key = room.type === 'channel' ? 'channel_created' : 'group_created';
    toast('✅ ' + t(key));
    openChat(room.id);
  });
  socket.on('invited', ({ names }) => toast('✅ ' + names.join(', ')));
  socket.on('contact-added', ({ userId }) => { setTimeout(() => openChat(userId), 200); });
  socket.on('contact-removed', ({ userId }) => { if (currentRoomId === userId) openChat('public'); });
  socket.on('search-result', ({ query, results }) => renderSearchResults(query, results));
  socket.on('search-messages-result', ({ query, results }) => renderMsgSearchResults(query, results));

  socket.on('invite-created', ({ code, link }) => {
    const fullLink = location.origin + link;
    $('inviteLinkInput').value = fullLink;
    $('inviteLinkModal').style.display = 'flex';
  });
  socket.on('invite-redeemed', ({ roomId, alreadyMember }) => {
    if (!alreadyMember) {
      setTimeout(() => openChat(roomId), 300);
    }
  });
  socket.on('invite-error', ({ text }) => toast('⚠️ ' + text));

  socket.on('message', msg => {
    addMessage(msg);
    if (msg.from !== me.userId) {
      socket.emit('delivered', { userId: me.userId, messageIds: [msg.id] });
      const key = chatKeyFor(msg);
      if (key === currentRoomId && !document.hidden) {
        setTimeout(() => socket.emit('read', { userId: me.userId, messageIds: [msg.id] }), 400);
      }
    }
  });

  socket.on('message-update', updated => {
    const idx = allMessages.findIndex(m => m.id === updated.id);
    if (idx >= 0) {
      allMessages[idx] = updated;
      if (chatKeyFor(updated) === currentRoomId) renderMessages();
    }
  });

  socket.on('typing', ({ from, fromName, to }) => {
    if (from === me.userId) return;
    const key = to === 'public' ? 'public' : (to.startsWith('r_') ? to : from);
    typingUsers[from] = { name: fromName, key };
    if (key === currentRoomId) renderMessages();
    clearTimeout(typingUsers[from]._t);
    typingUsers[from]._t = setTimeout(() => {
      delete typingUsers[from];
      if (key === currentRoomId) renderMessages();
    }, 3000);
  });
}

// ============================================================
// LOCAL STORAGE
// ============================================================
function saveMeLocal() {
  try { localStorage.setItem('messenger_me', JSON.stringify(me)); } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem('messenger_settings', JSON.stringify(userSettings)); } catch (e) {}
  if (me && socket && socket.connected) {
    socket.emit('update-settings', { userId: me.userId, settings: userSettings });
  }
}

// ============================================================
// UTILS
// ============================================================
function chatKeyFor(msg) {
  if (msg.to === 'public') return 'public';
  if (msg.to.startsWith('r_')) return msg.to;
  return msg.from === me.userId ? msg.to : msg.from;
}
function avatarHtml(u) {
  if (u && u.avatar) return '<img src="' + u.avatar + '" alt="">';
  return escapeHtml(u.initials || '?');
}
function avatarStyle(u) {
  return u.avatar ? 'background:#1a1d35' : ('background:' + u.color);
}
function urlBase64ToUint8Array(s) {
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const b = (s + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = window.atob(b);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/upload', { method: 'POST', body: fd });
  if (!res.ok) throw new Error('Upload error');
  return await res.json();
}

// ============================================================
// MESSAGES
// ============================================================
function addMessage(msg) {
  if (allMessages.some(m => m.id === msg.id)) return;
  allMessages.push(msg);
  const key = chatKeyFor(msg);
  if (key === currentRoomId) renderMessages();
  else if (msg.from !== me.userId) unread[key] = (unread[key] || 0) + 1;
  renderChats();
}
function getChatMessages(chatId) {
  if (chatId === 'public') return allMessages.filter(m => m.to === 'public');
  if (chatId.startsWith('r_')) return allMessages.filter(m => m.to === chatId);
  return allMessages.filter(m => (m.from === me.userId && m.to === chatId) || (m.from === chatId && m.to === me.userId));
}
function renderStatus(m, chatId) {
  if (m.from !== me.userId || m.deleted) return '';
  const isPersonal = !chatId.startsWith('r_') && chatId !== 'public';
  const room = rooms.find(r => r.id === chatId);
  const recipients = isPersonal ? [chatId]
    : (chatId === 'public' ? users.map(u => u.userId).filter(x => x !== me.userId)
    : ((room && room.members) || []).filter(x => x !== me.userId));
  const total = recipients.length;
  const readCount = (m.readBy || []).filter(x => x !== me.userId).length;
  const delivCount = (m.deliveredTo || []).filter(x => x !== me.userId).length;
  if (isPersonal) {
    if (readCount >= 1) return '<span class="msg-status read">✓✓</span>';
    if (delivCount >= 1) return '<span class="msg-status">✓✓</span>';
    return '<span class="msg-status">✓</span>';
  }
  if (total === 0) return '<span class="msg-status">✓</span>';
  const cls = readCount >= total ? 'msg-status read' : 'msg-status';
  return '<span class="' + cls + '">✓✓ <span class="msg-reads">' + readCount + '/' + total + '</span></span>';
}

function renderMessages() {
  if (!messagesEl) return;
  const msgs = getChatMessages(currentRoomId);
  messagesEl.innerHTML = '';
  if (!msgs.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-chat';
    let text = t('no_messages_yet');
    if (currentRoomId.startsWith('r_')) {
      const room = rooms.find(r => r.id === currentRoomId);
      if (room && room.type === 'channel') text = t('no_posts_channel');
    }
    empty.innerHTML = '<div class="em">💬</div><p>' + text + '</p>';
    messagesEl.appendChild(empty);
  } else {
    let lastFrom = null;
    msgs.forEach(m => {
      const isMe = m.from === me.userId;
      const isGroup = currentRoomId === 'public' || currentRoomId.startsWith('r_');
      const showSender = !isMe && isGroup && m.from !== lastFrom;
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + (isMe ? 'me' : 'them');
      wrap.dataset.msgId = m.id;
      if (m.pinned) wrap.classList.add('pinned-target');

      if (showSender) {
        const u = users.find(x => x.userId === m.from);
        const name = document.createElement('div');
        name.className = 'sender-name';
        if (u && u.avatar) name.innerHTML = '<img src="' + u.avatar + '" class="sender-avatar" alt=""> <span>' + escapeHtml(m.fromName || 'Anon') + '</span>';
        else name.textContent = m.fromName || 'Anon';
        if (u && u.color) { const c = u.color.match(/#[0-9a-f]{6}/i); if (c) name.style.color = c[0]; }
        wrap.appendChild(name);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg ' + (isMe ? 'outgoing' : 'incoming') + (m.deleted ? ' deleted' : '');

      let html = '';
      if (m.replyTo && !m.deleted) {
        html += '<div class="msg-reply"><div class="msg-reply-author">' + escapeHtml(m.replyTo.fromName || '') + '</div><div class="msg-reply-text">' + escapeHtml(m.replyTo.text || t('file')) + '</div></div>';
      }
      if (m.deleted) {
        html += '<div class="msg-text">' + t('message_deleted') + '</div>';
      } else {
        if (m.file) {
          if (m.file.type && m.file.type.indexOf('image/') === 0) {
            html += '<img class="msg-image" src="' + m.file.url + '" alt="" loading="lazy" data-img="' + m.file.url + '">';
          } else {
            html += '<a class="msg-file" href="' + m.file.url + '" download="' + escapeHtml(m.file.name) + '"><span class="file-icon">📎</span><span class="file-details"><span class="file-name">' + escapeHtml(m.file.name) + '</span><span class="file-size">' + formatSize(m.file.size) + '</span></span></a>';
          }
        }
        if (m.text) html += '<div class="msg-text">' + escapeHtml(m.text).replace(/\n/g, '<br>') + '</div>';
      }
      html += '<div class="msg-footer">';
      if (m.edited && !m.deleted) html += '<span class="msg-edited">' + t('edited_label') + '</span>';
      html += '<span class="msg-time">' + m.time + '</span>' + renderStatus(m, currentRoomId) + '</div>';
      bubble.innerHTML = html;

      if (m.reactions && Object.keys(m.reactions).length && !m.deleted) {
        const reactionsDiv = document.createElement('div');
        reactionsDiv.className = 'msg-reactions';
        Object.keys(m.reactions).forEach(emoji => {
          const uids = m.reactions[emoji];
          if (!uids || !uids.length) return;
          const r = document.createElement('div');
          r.className = 'reaction' + (uids.indexOf(me.userId) >= 0 ? ' mine' : '');
          r.innerHTML = '<span>' + emoji + '</span><span class="reaction-count">' + uids.length + '</span>';
          r.onclick = ev => {
            ev.stopPropagation();
            socket.emit('react-message', { messageId: m.id, userId: me.userId, emoji });
          };
          reactionsDiv.appendChild(r);
        });
        wrap.appendChild(bubble);
        wrap.appendChild(reactionsDiv);
      } else {
        wrap.appendChild(bubble);
      }
      messagesEl.appendChild(wrap);
      lastFrom = m.from;
    });
  }

  const typingKeys = Object.keys(typingUsers).filter(k => typingUsers[k].key === currentRoomId);
  if (typingKeys.length) {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
  }
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });

  // Pinned bar
  updatePinnedBar();
}

// ============================================================
// PINNED BAR
// ============================================================
function updatePinnedBar() {
  const bar = $('pinnedBar');
  if (!bar) return;
  const msgs = getChatMessages(currentRoomId);
  const pinned = msgs.filter(m => m.pinned && !m.deleted);
  if (!pinned.length) { bar.classList.remove('show'); return; }
  const m = pinned[pinned.length - 1];
  bar.classList.add('show');
  $('pinnedBarAuthor').textContent = m.from === me.userId ? me.name : (m.fromName || '');
  let text = m.text || (m.file ? '📎 ' + m.file.name : '');
  $('pinnedBarText').textContent = text.slice(0, 120);
  bar.onclick = e => {
    if (e.target.closest('.pinned-bar-close')) return;
    const el = messagesEl.querySelector('[data-msg-id="' + m.id + '"]');
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const bub = el.querySelector('.msg');
      if (bub) {
        bub.style.transition = 'box-shadow 0.5s';
        bub.style.boxShadow = '0 0 0 3px var(--accent)';
        setTimeout(() => { bub.style.boxShadow = ''; }, 2000);
      }
    }
  };
}

// ============================================================
// CHATS LIST
// ============================================================
function sectionLabel(text) { const el = document.createElement('div'); el.className = 'section-label'; el.textContent = text; return el; }

function renderRoomItem(room, lastMsg, chatId, emoji) {
  emoji = emoji || '🌐';
  const item = document.createElement('div');
  item.className = 'chat-item' + (chatId && currentRoomId === chatId ? ' active' : '');
  const preview = lastMsg
    ? ((lastMsg.from === me.userId ? t('personal') + ': ' : (lastMsg.fromName ? escapeHtml(lastMsg.fromName) + ': ' : '')) + (lastMsg.deleted ? t('message_deleted') : (lastMsg.file ? '📎 ' + escapeHtml(lastMsg.file.name) : escapeHtml(lastMsg.text))))
    : (room.description || '');
  const isMuted = mutedChats.indexOf(chatId) >= 0;
  const hasPinned = lastMsg && lastMsg.pinned;
  item.innerHTML = '<div class="avatar" style="background:' + (room.gradient || room.color || 'var(--accent-grad)') + '"><span class="room-emoji">' + emoji + '</span></div>' +
    '<div class="chat-info">' +
      '<div class="chat-top">' +
        '<span class="chat-name">' + escapeHtml(room.name) + (isMuted ? ' <span class="chat-mute-icon">🔕</span>' : '') + (hasPinned ? ' <span class="chat-pin-icon">📌</span>' : '') + '</span>' +
        '<span class="chat-time">' + (lastMsg ? lastMsg.time : '') + '</span>' +
      '</div>' +
      '<div class="chat-bottom">' +
        '<span class="chat-preview">' + preview + '</span>' +
        (unread[chatId] ? '<span class="badge' + (isMuted ? ' muted' : '') + '">' + unread[chatId] + '</span>' : '') +
      '</div>' +
    '</div>';
  if (chatId) item.onclick = () => openChat(chatId);
  return item;
}

function renderUserItem(u) {
  const key = u.userId;
  const msgs = getChatMessages(key);
  const last = msgs.slice(-1)[0];
  const item = document.createElement('div');
  item.className = 'chat-item' + (currentRoomId === key ? ' active' : '');
  item.innerHTML = '<div class="avatar" style="' + avatarStyle(u) + '">' + avatarHtml(u) + '<span class="status ' + (u.online ? '' : 'offline') + '"></span></div>' +
    '<div class="chat-info">' +
      '<div class="chat-top"><span class="chat-name">' + escapeHtml(u.name) + '</span><span class="chat-time">' + (last ? last.time : '') + '</span></div>' +
      '<div class="chat-bottom">' +
        '<span class="chat-preview">' + (last ? ((last.from === me.userId ? t('personal') + ': ' : '') + (last.deleted ? t('message_deleted') : (last.file ? '📎 ' + escapeHtml(last.file.name) : escapeHtml(last.text)))) : ('@' + escapeHtml(u.username))) + '</span>' +
        (unread[key] ? '<span class="badge">' + unread[key] + '</span>' : '') +
      '</div>' +
    '</div>';
  item.onclick = () => openChat(key);
  return item;
}

function renderChats() {
  if (!me || !chatsEl) return;
  chatsEl.innerHTML = '';
  const f = currentFilter.trim().toLowerCase();
  const match = text => !f || String(text).toLowerCase().indexOf(f) >= 0;

  if (match('общий') || match('general')) {
    const pubMsgs = getChatMessages('public');
    chatsEl.appendChild(renderRoomItem({ id: 'public', name: t('public_chat'), emoji: '🌐', gradient: 'var(--accent-grad)' }, pubMsgs.slice(-1)[0], 'public'));
  }

  const myRooms = rooms.filter(r => Array.isArray(r.members) && r.members.indexOf(me.userId) >= 0);
  const myChannels = myRooms.filter(r => r.type === 'channel' && match(r.name));
  const myGroups = myRooms.filter(r => r.type === 'group' && match(r.name));

  if (myChannels.length) {
    chatsEl.appendChild(sectionLabel('📢 ' + t('channels') + ' · ' + myChannels.length));
    myChannels.forEach(r => chatsEl.appendChild(renderRoomItem(r, getChatMessages(r.id).slice(-1)[0], r.id, '📢')));
  }
  if (myGroups.length) {
    chatsEl.appendChild(sectionLabel('👥 ' + t('groups') + ' · ' + myGroups.length));
    myGroups.forEach(r => chatsEl.appendChild(renderRoomItem(r, getChatMessages(r.id).slice(-1)[0], r.id, '👥')));
  }

  const available = rooms.filter(r => Array.isArray(r.members) && r.members.indexOf(me.userId) < 0 && match(r.name));
  if (available.length) {
    chatsEl.appendChild(sectionLabel('🌐 ' + t('available') + ' · ' + available.length));
    available.forEach(r => {
      const item = renderRoomItem(r, null, null, r.type === 'channel' ? '📢' : '👥');
      const btn = document.createElement('button');
      btn.className = 'join-btn';
      btn.textContent = '+';
      btn.onclick = e => {
        e.stopPropagation();
        socket.emit('join-room', { roomId: r.id, userId: me.userId });
        setTimeout(() => openChat(r.id), 150);
      };
      item.appendChild(btn);
      item.onclick = () => {
        socket.emit('join-room', { roomId: r.id, userId: me.userId });
        setTimeout(() => openChat(r.id), 150);
      };
      chatsEl.appendChild(item);
    });
  }

  const filteredUsers = users.filter(u => match(u.name) || match('@' + u.username));
  if (filteredUsers.length) {
    chatsEl.appendChild(sectionLabel('💬 ' + t('personal') + ' · ' + filteredUsers.length));
    filteredUsers.sort((a, b) => {
      const aM = getChatMessages(a.userId), bM = getChatMessages(b.userId);
      const aL = aM[aM.length - 1], bL = bM[bM.length - 1];
      if (aL && bL) return bL.timestamp - aL.timestamp;
      if (aL) return -1;
      if (bL) return 1;
      return a.name.localeCompare(b.name, currentLang === 'ru' ? 'ru' : 'en');
    });
    filteredUsers.forEach(u => chatsEl.appendChild(renderUserItem(u)));
  } else if (!f) {
    chatsEl.appendChild(sectionLabel(t('no_contacts')));
  }
}

// ============================================================
// HEADER
// ============================================================
function updateHeader() {
  if (!me) return;
  const ha = $('headerAvatar'), hn = $('headerName'), hs = $('headerStatus'), actions = $('headerActions');
  if (!ha) return;
  actions.innerHTML = '';

  if (currentRoomId === 'public') {
    ha.innerHTML = '🌐'; ha.style.background = 'var(--accent-grad)';
    hn.innerHTML = t('public_chat') + ' <span class="room-tag">' + t('public_chat') + '</span>';
    hs.className = ''; hs.textContent = users.length + ' ' + (users.length === 1 ? t('chatters') : t('chatters_plural'));
    const pinBtn = mkIconBtn('📌', 'Pin', () => pinLastInChat('public'));
    pinBtn.style.display = 'none';
    const muteBtn = mkIconBtn(mutedChats.indexOf('public') >= 0 ? '🔔' : '🔕', 'Mute', () => toggleMute('public'));
    actions.appendChild(muteBtn);
    return;
  }

  if (currentRoomId.startsWith('r_')) {
    const room = rooms.find(r => r.id === currentRoomId);
    if (!room) return;
    ha.innerHTML = '<span class="room-emoji">' + (room.type === 'channel' ? '📢' : '👥') + '</span>';
    ha.style.background = room.color;
    const myRole = (room.roles && room.roles[me.userId]) || (room.createdBy === me.userId ? 'owner' : (Array.isArray(room.admins) && room.admins.includes(me.userId) ? 'admin' : 'member'));
    const isAdmin = myRole === 'owner' || myRole === 'admin';
    hn.innerHTML = escapeHtml(room.name) + ' <span class="room-tag">' + (room.type === 'channel' ? t('channel') : t('group')) + '</span>';
    const onlineCount = room.members.filter(mid => users.some(u => u.userId === mid && u.online)).length;
    let statusText = room.members.length + ' ' + (room.members.length === 1 ? t('chatters') : t('chatters_plural'));
    if (onlineCount) statusText += ' · ' + onlineCount + ' ' + t('online_now');
    if (myRole === 'owner') statusText += ' · ' + t('you_are_owner');
    else if (myRole === 'admin') statusText += ' · ' + t('you_are_admin');
    hs.className = ''; hs.textContent = statusText;

    // Кнопки
    const membersBtn = mkIconBtn('👥', 'Members', () => openMembers(room.id));
    actions.appendChild(membersBtn);

    const isMuted = mutedChats.indexOf(room.id) >= 0;
    const muteBtn = mkIconBtn(isMuted ? '🔔' : '🔕', 'Mute', () => toggleMute(room.id));
    actions.appendChild(muteBtn);

    if (isAdmin) {
      const invBtn = mkIconBtn('➕', 'Invite', () => {
        $('inviteRoomName').textContent = '"' + room.name + '"';
        $('inviteInput').value = '';
        $('inviteModal').style.display = 'flex';
        setTimeout(() => $('inviteInput').focus(), 100);
      });
      actions.appendChild(invBtn);

      const linkBtn = mkIconBtn('🔗', 'Invite link', () => {
        socket.emit('create-invite', { roomId: room.id, byUserId: me.userId });
      });
      actions.appendChild(linkBtn);
    }

    const leaveBtn = mkIconBtn('🚪', 'Leave', () => {
      if (confirm(t('leave_confirm'))) {
        socket.emit('leave-room', { roomId: room.id, userId: me.userId });
        openChat('public');
      }
    });
    leaveBtn.classList.add('danger');
    actions.appendChild(leaveBtn);
    return;
  }

  // Personal chat
  const u = users.find(x => x.userId === currentRoomId);
  if (!u) {
    ha.textContent = '?'; ha.style.background = '#2a2d44';
    hn.textContent = '—'; hs.textContent = '';
    return;
  }
  ha.innerHTML = avatarHtml(u);
  ha.style.background = u.avatar ? '#1a1d35' : u.color;
  hn.textContent = u.name;
  hs.className = u.online ? 'online' : '';
  hs.innerHTML = '<span class="dot"></span>' + (u.online ? t('online') : '@' + escapeHtml(u.username));

  const isMuted = mutedChats.indexOf(u.userId) >= 0;
  const muteBtn = mkIconBtn(isMuted ? '🔔' : '🔕', 'Mute', () => toggleMute(u.userId));
  actions.appendChild(muteBtn);

  const rmBtn = mkIconBtn('🗑', 'Delete contact', () => {
    if (confirm('Удалить ' + u.name + '?')) socket.emit('remove-contact', { userId: me.userId, contactId: u.userId });
  });
  rmBtn.classList.add('danger');
  actions.appendChild(rmBtn);
}

function mkIconBtn(text, title, onClick) {
  const b = document.createElement('button');
  b.className = 'icon-btn';
  b.title = title;
  b.textContent = text;
  b.style.fontSize = '18px';
  b.onclick = onClick;
  return b;
}

function pinLastInChat(chatId) {
  const msgs = getChatMessages(chatId);
  const last = msgs.slice(-1).reverse().find(m => !m.deleted);
  if (!last) return;
  socket.emit('pin-message', { messageId: last.id, userId: me.userId });
}

// ============================================================
// OPEN CHAT / INPUT STATE / READ
// ============================================================
function openChat(id) {
  currentRoomId = id;
  unread[id] = 0;
  replyTo = null; renderReplyPreview();
  renderChats(); renderMessages(); updateHeader(); updateInputState(); markCurrentAsRead();
  if (window.innerWidth <= 720) $('sidebar').classList.add('hidden');
}

function updateInputState() {
  if (!me || !inputEl) return;
  if (currentRoomId.startsWith('r_')) {
    const room = rooms.find(r => r.id === currentRoomId);
    if (room && room.type === 'channel') {
      const myRole = (room.roles && room.roles[me.userId]) || (room.createdBy === me.userId ? 'owner' : 'member');
      if (myRole !== 'owner' && myRole !== 'admin') {
        inputEl.disabled = true;
        inputEl.placeholder = t('only_admins_channel');
        sendBtn.disabled = true;
        $('attachBtn').disabled = true;
        return;
      }
    }
  }
  inputEl.disabled = false;
  inputEl.placeholder = t('write_message');
  sendBtn.disabled = false;
  $('attachBtn').disabled = false;
}

function markCurrentAsRead() {
  if (document.hidden || !me) return;
  const msgs = getChatMessages(currentRoomId);
  const ids = msgs.filter(m => m.from !== me.userId && !(m.readBy || []).includes(me.userId)).map(m => m.id);
  if (ids.length) socket.emit('read', { userId: me.userId, messageIds: ids });
}

// ============================================================
// MUTE
// ============================================================
function toggleMute(chatId) {
  const isMuted = mutedChats.indexOf(chatId) >= 0;
  socket.emit('mute-chat', { userId: me.userId, chatId, muted: !isMuted });
  toast(isMuted ? t('badge_unmuted') : t('badge_muted'));
}

function updateProfilePreview() {

function buildAccentPicker() {
  const box = $('accentPicker');
  if (!box) return;

// ============================================================
// MEMBERS + ROLES + KICK
// ============================================================
function openMembers(roomId) {
  const room = rooms.find(r => r.id === roomId);
  if (!room) return;
  const myRole = (room.roles && room.roles[me.userId]) || (room.createdBy === me.userId ? 'owner' : 'member');
  $('membersRoomName').textContent = room.name + ' · ' + room.members.length;
  const list = $('membersList');
  list.innerHTML = '';

  const sorted = room.members.slice().sort((a, b) => {
    const ra = (room.roles && room.roles[a]) || (room.createdBy === a ? 'owner' : 'member');
    const rb = (room.roles && room.roles[b]) || (room.createdBy === b ? 'owner' : 'member');
    const order = { owner: 0, admin: 1, member: 2 };
    return (order[ra] || 3) - (order[rb] || 3);
  });

  sorted.forEach(uid => {
    const u = users.find(x => x.userId === uid) || (uid === me.userId ? me : null);
    if (!u) return;
    const r = (room.roles && room.roles[uid]) || (room.createdBy === uid ? 'owner' : 'member');
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = '<div class="avatar" style="' + avatarStyle(u) + '">' + avatarHtml(u) + '</div>' +
      '<div class="member-info"><div class="member-name">' + escapeHtml(u.name) + ' <span class="member-role-badge ' + r + '">' + t(r) + '</span></div>' +
      '<div style="font-size:12px;color:var(--text-dim)">@' + escapeHtml(u.username) + '</div></div>';
    const actions = document.createElement('div');
    actions.className = 'member-actions';

    if (myRole === 'owner' && uid !== me.userId && r !== 'owner') {
      const toggleAdmin = document.createElement('button');
      toggleAdmin.textContent = r === 'admin' ? '👤' : '⭐';
      toggleAdmin.title = r === 'admin' ? t('revoke_admin') : t('make_admin');
      toggleAdmin.onclick = () => {
        socket.emit('set-role', { roomId: room.id, byUserId: me.userId, targetUserId: uid, role: r === 'admin' ? 'member' : 'admin' });
        setTimeout(() => openMembers(roomId), 300);
      };
      actions.appendChild(toggleAdmin);
    }

    if ((myRole === 'owner' || myRole === 'admin') && uid !== me.userId && r !== 'owner' && !(myRole === 'admin' && r === 'admin')) {
      const kickBtn = document.createElement('button');
      kickBtn.className = 'danger';
      kickBtn.textContent = '❌';
      kickBtn.title = t('kick');
      kickBtn.onclick = () => {
        if (confirm(t('kick_confirm'))) {
          socket.emit('kick-user', { roomId: room.id, byUserId: me.userId, targetUserId: uid });
          setTimeout(() => openMembers(roomId), 300);
        }
      };
      actions.appendChild(kickBtn);
    }
    row.appendChild(actions);
    list.appendChild(row);
  });

  $('membersModal').style.display = 'flex';
}

// ============================================================
// SEARCH RESULTS
// ============================================================
function renderSearchResults(query, results) {
  const box = $('searchResults');
  if (!results || !results.length) {
    box.innerHTML = '<div class="empty-search">@' + escapeHtml(query) + ' — ' + 0 + '</div>';
    return;
  }
  box.innerHTML = '';
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.innerHTML = '<div class="avatar" style="' + avatarStyle(r) + '">' + avatarHtml(r) + '</div>' +
      '<div class="info"><div class="name">' + escapeHtml(r.name) + '</div><div class="username">@' + escapeHtml(r.username) + (r.online ? ' · ' + t('online') : '') + '</div></div>' +
      '<button class="add-btn">+</button>';
    const handle = () => {
      socket.emit('add-contact', { userId: me.userId, contactId: r.userId });
      $('searchModal').style.display = 'none';
    };
    item.querySelector('.add-btn').onclick = e => { e.stopPropagation(); handle(); };
    item.onclick = handle;
    box.appendChild(item);
  });
}

function renderMsgSearchResults(query, results) {
  const box = $('msgSearchResults');
  if (!results || !results.length) { box.innerHTML = '<div class="empty-search">' + 0 + '</div>'; return; }
  box.innerHTML = '';
  const q = query.toLowerCase();
  results.forEach(m => {
    const item = document.createElement('div');
    item.className = 'search-messages-result';
    const chatName = m.to === 'public' ? t('public_chat') : (m.to.startsWith('r_') ? ((rooms.find(r => r.id === m.to) || {}).name || '') : t('personal'));
    const date = new Date(m.timestamp).toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    let text = escapeHtml(m.text || '');
    const idx = text.toLowerCase().indexOf(q);
    if (idx >= 0) text = text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
    item.innerHTML = '<div class="smeta"><span><b>' + escapeHtml(m.fromName || '') + '</b> · ' + escapeHtml(chatName) + '</span><span>' + date + '</span></div><div class="stext">' + text + '</div>';
    item.onclick = () => {
      $('msgSearchModal').style.display = 'none';
      openChat(chatKeyFor(m));
      setTimeout(() => {
        const el = messagesEl.querySelector('[data-msg-id="' + m.id + '"]');
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const bub = el.querySelector('.msg');
          if (bub) {
            bub.style.transition = 'box-shadow 0.5s';
            bub.style.boxShadow = '0 0 0 3px var(--accent)';
            setTimeout(() => { bub.style.boxShadow = ''; }, 2500);
          }
        }
      }, 300);
    };
    box.appendChild(item);
  });
}

// ============================================================
// REPLY
// ============================================================
function renderReplyPreview() {
  if (!replyTo) { replyPreviewEl.style.display = 'none'; replyPreviewEl.innerHTML = ''; return; }
  replyPreviewEl.style.display = 'block';
  replyPreviewEl.innerHTML = '<div class="reply-preview-inner"><div class="reply-preview-info"><div class="reply-preview-author">' + escapeHtml(replyTo.fromName) + '</div><div class="reply-preview-text">' + escapeHtml(replyTo.text || t('file')) + '</div></div><button class="reply-preview-close">×</button></div>';
  replyPreviewEl.querySelector('.reply-preview-close').onclick = () => { replyTo = null; renderReplyPreview(); };
}
function setReplyTo(msg) {
  replyTo = {
    id: msg.id, from: msg.from, fromName: msg.fromName,
    text: msg.deleted ? t('message_deleted') : (msg.text || (msg.file ? '📎 ' + msg.file.name : ''))
  };
  renderReplyPreview();
  inputEl.focus();
}

// ============================================================
// CONTEXT MENU
// ============================================================
let activeContext = null;
function closeContext() { if (activeContext) { activeContext.remove(); activeContext = null; } }

function openMessageActions(msgId, x, y) {
  closeContext();
  const m = allMessages.find(mm => mm.id === msgId);
  if (!m || m.deleted) return;
  const isMe = m.from === me.userId;

  // Проверка прав на pin
  let canPin = false;
  if (m.to === 'public') canPin = true;
  else if (m.to.startsWith('r_')) {
    const room = rooms.find(r => r.id === m.to);
    if (room) {
      const myRole = (room.roles && room.roles[me.userId]) || (room.createdBy === me.userId ? 'owner' : 'member');
      canPin = myRole === 'owner' || myRole === 'admin';
    }
  }

  const bar = document.createElement('div');
  bar.className = 'reactions-bar';
  EMOJIS.forEach(emoji => {
    const b = document.createElement('button');
    b.textContent = emoji;
    b.onclick = ev => {
      ev.stopPropagation();
      socket.emit('react-message', { messageId: msgId, userId: me.userId, emoji });
      bar.remove();
    };
    bar.appendChild(b);
  });
  document.body.appendChild(bar);
  const bw = bar.offsetWidth, bh = bar.offsetHeight;
  let bx = Math.max(10, Math.min(x - bw / 2, window.innerWidth - bw - 10));
  let by = y - bh - 12;
  if (by < 10) by = y + 20;
  bar.style.left = bx + 'px';
  bar.style.top = by + 'px';

  const menu = document.createElement('div');
  menu.className = 'context-menu';
  const items = [];

  items.push({ icon: '↩️', text: t('reply'), action: () => setReplyTo(m) });

  if (isMe && m.text) {
    items.push({ icon: '✏️', text: t('edit'), action: () => openEditModal(m) });
  }

  if (canPin) {
    items.push({
      icon: '📌',
      text: m.pinned ? t('unpin') : t('pin'),
      action: () => socket.emit('pin-message', { messageId: msgId, userId: me.userId })
    });
  }

  if (isMe) {
    items.push({
      icon: '🗑', text: t('delete'), danger: true,
      action: () => {
        if (confirm(t('delete_confirm'))) socket.emit('delete-message', { messageId: msgId, userId: me.userId });
      }
    });
  }

  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'context-menu-item' + (it.danger ? ' danger' : '');
    el.innerHTML = '<span style="font-size:16px">' + it.icon + '</span> ' + it.text;
    el.onclick = ev => {
      ev.stopPropagation();
      it.action();
      menu.remove();
      bar.remove();
    };
    menu.appendChild(el);
  });
  document.body.appendChild(menu);
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let mx = Math.max(10, Math.min(x, window.innerWidth - mw - 10));
  let my = y;
  if (my + mh > window.innerHeight - 10) my = window.innerHeight - mh - 10;
  menu.style.left = mx + 'px';
  menu.style.top = my + 'px';

  activeContext = { remove: () => { menu.remove(); bar.remove(); } };
}

function openEditModal(m) {
  const overlay = document.createElement('div');
  overlay.className = 'edit-modal-overlay';
  overlay.innerHTML = '<div class="edit-modal"><h3>' + t('edit_hint') + '</h3><textarea id="editTextarea"></textarea><div class="edit-modal-actions"><button class="cancel-btn">' + t('cancel') + '</button><button class="save-btn">' + t('save') + '</button></div></div>';
  document.body.appendChild(overlay);
  const ta = overlay.querySelector('#editTextarea');
  ta.value = m.text || '';
  ta.focus();
  overlay.querySelector('.cancel-btn').onclick = () => overlay.remove();
  overlay.querySelector('.save-btn').onclick = () => {
    const v = ta.value.trim();
    if (!v) return;
    socket.emit('edit-message', { messageId: m.id, userId: me.userId, newText: v });
    overlay.remove();
  };
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

// ============================================================
// SEND MESSAGE / FILES
// ============================================================
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text && !pendingFile) return;
  if (!socket.connected) return toast(t('no_connection'));
  if (inputEl.disabled) return;

  let fileData = null;
  if (pendingFile) {
    sendBtn.classList.add('uploading');
    sendBtn.disabled = true;
    try { fileData = await uploadFile(pendingFile); }
    catch (e) {
      toast(t('error') + ': ' + e.message);
      sendBtn.classList.remove('uploading');
      sendBtn.disabled = false;
      updateInputState();
      return;
    }
  }
  const ts = Date.now();
  const msg = {
    id: 'm_' + ts + '_' + Math.random().toString(36).slice(2, 8),
    from: me.userId, fromName: me.name,
    to: currentRoomId,
    text: text, file: fileData,
    replyTo: replyTo ? { id: replyTo.id, from: replyTo.from, fromName: replyTo.fromName, text: replyTo.text } : null,
    timestamp: ts
  };
  addMessage(Object.assign({}, msg, {
    time: fmtTime(ts),
    deliveredTo: [], readBy: [],
    reactions: {}, edited: false, deleted: false, pinned: false
  }));
  socket.emit('message', msg);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  pendingFile = null;
  renderPendingFile();
  replyTo = null;
  renderReplyPreview();
  sendBtn.classList.remove('uploading');
  updateInputState();
  inputEl.focus();
}

function renderPendingFile() {
  if (!pendingFile) { pendingFileEl.style.display = 'none'; pendingFileEl.innerHTML = ''; return; }
  pendingFileEl.style.display = 'block';
  const isImage = pendingFile.type.indexOf('image/') === 0;
  const preview = isImage ? '<img class="pending-preview-img" src="' + URL.createObjectURL(pendingFile) + '" alt="">' : '<div class="file-icon" style="font-size:28px">📎</div>';
  pendingFileEl.innerHTML = '<div class="pending-file-inner">' + preview +
    '<div class="pending-file-info"><div class="name">' + escapeHtml(pendingFile.name) + '</div><div class="size">' + formatSize(pendingFile.size) + '</div></div>' +
    '<button class="pending-remove">×</button></div>';
  pendingFileEl.querySelector('.pending-remove').onclick = () => { pendingFile = null; renderPendingFile(); };
}
function pickFile(file) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) return toast(t('file_too_big'));
  pendingFile = file;
  renderPendingFile();
}

// ============================================================
// PUSH
// ============================================================
async function initPushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const sub = await reg.pushManager.getSubscription();
    pushEnabled = !!sub;
    if (accountMenu && accountMenu.classList.contains('open')) updateAccountMenu();
  } catch (e) {}
}
async function toggleNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('Push not supported');
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      await fetch('/unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: me.userId, endpoint: sub.endpoint })
      });
      await sub.unsubscribe();
      pushEnabled = false;
      updateAccountMenu();
      return toast('🔕 ' + t('off'));
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Denied');
    const { key } = await fetch('/vapid-public-key').then(r => r.json());
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) });
    await fetch('/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: me.userId, subscription: sub })
    });
    pushEnabled = true;
    updateAccountMenu();
    toast('🔔 ' + t('on'));
  } catch (e) { toast(t('error') + ': ' + e.message); }
}
